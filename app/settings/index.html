<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OffScript! | Settings</title>
    <link
      rel="icon"
      type="image/png"
      href="/assets/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest" />
    <link rel="stylesheet" href="/css/app/main.css" />
    <script src="/js/app/storage.js" defer></script>
    <script src="/js/app/feedback.js" defer></script>
    <script src="/js/app/nav.js" defer></script>
  </head>
  <body>
    <main class="app-page">
      <header class="page-header">
        <h1>Settings</h1>
        <p>Account and app preferences.</p>
      </header>

      <section class="page-section">
        <h2 class="page-section-title">Account</h2>
        <article class="card stack">
          <div class="list-row">
            <span class="list-row-label">Email</span>
            <span class="list-row-value">Not signed in</span>
          </div>
          <div class="list-row">
            <span class="list-row-label">Sync</span>
            <span class="list-row-value">Local only</span>
          </div>
        </article>
      </section>

      <section class="page-section">
        <h2 class="page-section-title">Preferences</h2>
        <div class="empty-state">
          <p>More settings options will go here.</p>
        </div>
      </section>
    </main>
  </body>
</html>
