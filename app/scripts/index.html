<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OffScript! | Manage Scripts</title>
    <link
      rel="icon"
      type="image/png"
      href="/assets/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest" />
    <link rel="stylesheet" href="/css/app/main.css" />
    <script src="/js/app/nav.js" defer></script>
    <script src="/js/app/storage.js" defer></script>
    <script src="/js/app/uploads.js" defer></script>
  </head>
  <body>
    <main class="app-page">
      <header class="page-header">
        <h1>Manage Scripts</h1>
        <p>Add, edit, and organize your scripts.</p>
      </header>

      <section class="page-section">
        <h2 class="page-section-title">Add script</h2>
        <p
          class="upload-feedback"
          role="status"
          aria-live="polite"
          hidden
        ></p>
        <form class="add-script-form stack">
          <label for="script-file">Upload JSON file</label>
          <input
            type="file"
            id="script-file"
            name="script-file"
            accept=".json,application/json"
          />
          <label for="script-json">Or paste JSON</label>
          <textarea
            id="script-json"
            name="script-json"
            rows="10"
            placeholder="Paste a play.json object here"
          ></textarea>
          <button type="submit" class="button-primary">Add Script</button>
        </form>
      </section>
    </main>
  </body>
</html>
