<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OffScript! | Dashboard</title>
    <link
      rel="icon"
      type="image/png"
      href="/assets/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest" />
    <link rel="stylesheet" href="/css/app/main.css" />
    <script src="/js/app/storage.js" defer></script>
    <script src="/js/app/scripts-storage.js" defer></script>
    <script src="/js/app/settings-storage.js" defer></script>
    <script src="/js/app/config.js" defer></script>
    <script src="/js/app/script-lines.js" defer></script>
    <script src="/js/app/progress-storage.js" defer></script>
    <script src="/js/app/feedback.js" defer></script>
    <script src="/js/app/ui.js" defer></script>
    <script src="/js/app/nav.js" defer></script>
  </head>
  <body>
    <main class="app-page">
      <header class="page-header">
        <h1>Dashboard</h1>
        <p>Your home base for scripts, practice, and progress.</p>
      </header>

      <section class="page-section">
        <h2 class="page-section-title">At a glance</h2>
        <div class="stat-grid">
          <article class="stat-card">
            <p class="stat-card-value">1</p>
            <p class="stat-card-label">Active script</p>
          </article>
          <article class="stat-card">
            <p class="stat-card-value">0</p>
            <p class="stat-card-label">Sessions this week</p>
          </article>
          <article class="stat-card">
            <p class="stat-card-value">—</p>
            <p class="stat-card-label">Lines mastered</p>
          </article>
        </div>
      </section>

      <section class="page-section">
        <h2 class="page-section-title">Current script</h2>
        <article class="card">
          <h3 class="card-title">The Two Noble Kinsmen</h3>
          <p>Pick up where you left off or review your progress.</p>
          <div class="page-actions">
            <a href="/app/practice/read/" class="button-primary">Read</a>
            <a href="/app/overview/index.html" class="button-secondary">Overview</a>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
